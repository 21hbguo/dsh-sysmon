# dsh-sysmon bundle patch: inserts its plugin row into the web plugin roster.
# The single row mounts BOTH halves: the host side (metrics collector +
# /api/sysmon/snapshot route) and the browser side (the modules node scans
# dsh.client packages into the web plugin roster, served from lib/client.js).
- insert:
    - id: sysmon
      name: '@dsh-external/dsh-sysmon'
